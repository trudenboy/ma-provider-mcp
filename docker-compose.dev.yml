# Development docker-compose for FastMCP Server
# Runs a local Music Assistant instance with FastMCP Server provider pre-loaded.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up       # foreground
#   docker compose -f docker-compose.dev.yml up -d    # background
#   docker compose -f docker-compose.dev.yml down      # stop
#   docker compose -f docker-compose.dev.yml logs -f  # follow logs
#
# UI: http://localhost:8095
# MCP integration endpoint: http://localhost:8095/mcp/v1
# Live integration tests require MA_MCP_URL and MA_MCP_TOKEN from an MA user token.
# Runtime MA source: ${MA_SERVER_ROOT:-../ma-server}
# Note: add .ma-data/ to your .gitignore

services:
  ma:
    image: ghcr.io/music-assistant/server:nightly
    ports:
      - "8095:8095"
      - "8097:8097"
      - "8099:8099"
      - "8927:8927"
    privileged: true
    restart: "no"
    environment:
      PYTHONPATH: /ma-server
    volumes:
      - ${MA_DATA_DIR:-./.ma-data}:/data
      - ${MA_SERVER_ROOT:-../ma-server}:/ma-server:ro
      - ./provider/:/ma-server/music_assistant/providers/fastmcp_server:ro
      - ./tests/:/tmp/provider-tests:ro
      - ./pyproject.toml:/tmp/pyproject.toml:ro
      - ./scripts/docker-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
